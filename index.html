<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ニキシー管クロック・カウントダウンアニメーター</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0a0a0f; }
  .nixie-tube {
    display: inline-block;
    width: 72px;
    height: 110px;
    background: radial-gradient(ellipse at 50% 60%, #1a0e00 0%, #050308 70%);
    border: 2px solid #3a2800;
    border-radius: 12px 12px 20px 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(255,80,0,0.3), inset 0 0 15px rgba(0,0,0,0.8);
  }
  .nixie-digit {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 52px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    color: transparent;
    transition: color 0.1s, text-shadow 0.1s;
  }
  .nixie-digit.active {
    color: #ff6600;
    text-shadow: 0 0 8px #ff6600, 0 0 20px #ff4400, 0 0 40px #ff2200;
    animation: flicker 3s infinite;
  }
  @keyframes flicker {
    0%,95%,100% { opacity: 1; }
    96% { opacity: 0.85; }
    97% { opacity: 1; }
    98% { opacity: 0.9; }
  }
  .glow-sep {
    color: #ff4400;
    text-shadow: 0 0 10px #ff4400, 0 0 25px #ff2200;
    animation: blink-sep 1s step-end infinite;
    font-size: 48px;
    line-height: 110px;
  }
  @keyframes blink-sep { 0%,100%{opacity:1} 50%{opacity:0.1} }
  .tube-glow { box-shadow: 0 0 30px rgba(255,80,0,0.5), inset 0 0 15px rgba(255,80,0,0.05); }
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
  <h1 class="text-2xl font-bold text-orange-400 mb-2 tracking-widest" style="font-family:monospace;">NIXIE TUBE CLOCK</h1>
  <p class="text-orange-700 text-xs mb-6 tracking-wider">IN-14 / IN-18 TYPE VACUUM TUBE DISPLAY</p>

  <!-- Mode Tabs -->
  <div class="flex gap-2 mb-6">
    <button onclick="setMode('clock')" id="btn-clock" class="px-4 py-1.5 rounded bg-orange-800 text-orange-200 text-xs font-mono tracking-wider" aria-label="時計モード">CLOCK</button>
    <button onclick="setMode('countdown')" id="btn-countdown" class="px-4 py-1.5 rounded bg-gray-800 text-gray-500 text-xs font-mono tracking-wider" aria-label="カウントダウンモード">COUNTDOWN</button>
    <button onclick="setMode('stopwatch')" id="btn-stopwatch" class="px-4 py-1.5 rounded bg-gray-800 text-gray-500 text-xs font-mono tracking-wider" aria-label="ストップウォッチモード">STOPWATCH</button>
  </div>

  <!-- Display -->
  <div class="flex items-center gap-1 mb-8" id="display">
    <!-- Nixie tubes rendered by JS -->
  </div>

  <!-- Controls -->
  <div id="controls-countdown" class="hidden flex flex-col items-center gap-3">
    <div class="flex gap-2 items-center">
      <input type="number" id="cd-min" value="5" min="0" max="99" class="w-16 bg-gray-900 border border-orange-800 text-orange-400 text-center font-mono text-lg rounded px-2 py-1" aria-label="分">
      <span class="text-orange-600 font-mono">:</span>
      <input type="number" id="cd-sec" value="0" min="0" max="59" class="w-16 bg-gray-900 border border-orange-800 text-orange-400 text-center font-mono text-lg rounded px-2 py-1" aria-label="秒">
    </div>
    <div class="flex gap-2">
      <button onclick="cdStart()" class="px-4 py-1.5 bg-orange-700 hover:bg-orange-600 text-white text-xs font-mono rounded" aria-label="スタート">START</button>
      <button onclick="cdReset()" class="px-4 py-1.5 bg-gray-700 hover:bg-gray-600 text-white text-xs font-mono rounded" aria-label="リセット">RESET</button>
    </div>
  </div>
  <div id="controls-stopwatch" class="hidden flex gap-2">
    <button onclick="swToggle()" id="sw-btn" class="px-4 py-1.5 bg-orange-700 hover:bg-orange-600 text-white text-xs font-mono rounded" aria-label="スタート/ストップ">START</button>
    <button onclick="swReset()" class="px-4 py-1.5 bg-gray-700 hover:bg-gray-600 text-white text-xs font-mono rounded" aria-label="リセット">RESET</button>
  </div>

  <!-- Tube info -->
  <div class="mt-8 text-center text-orange-900 text-xs font-mono">
    <div>OPERATING VOLTAGE: 170V DC &nbsp;|&nbsp; CATHODE GLOW: NEON + ARGON</div>
    <div class="mt-1">TUBE TYPE: IN-14 (10-digit) &nbsp;|&nbsp; LIFESPAN: ~200,000 HRS</div>
  </div>

<script>
let mode = 'clock';
let cdInterval = null, swInterval = null;
let cdRemaining = 0, swMs = 0, swRunning = false;

function createTube(digit, separator = false) {
  if (separator) return `<span class="glow-sep">:</span>`;
  const d = String(digit).padStart(1,'0');
  return `<div class="nixie-tube tube-glow"><div class="nixie-digit active">${d}</div></div>`;
}

function renderDisplay(h, m, s) {
  const hs = String(h).padStart(2,'0');
  const ms = String(m).padStart(2,'0');
  const ss = String(s).padStart(2,'0');
  let html = '';
  for (let c of hs) html += createTube(c);
  html += createTube(null, true);
  for (let c of ms) html += createTube(c);
  html += createTube(null, true);
  for (let c of ss) html += createTube(c);
  document.getElementById('display').innerHTML = html;
  // Add slight random flicker brightness variation
  document.querySelectorAll('.nixie-digit.active').forEach(el => {
    const v = 0.85 + Math.random() * 0.15;
    el.style.opacity = v;
  });
}

function tickClock() {
  const now = new Date();
  renderDisplay(now.getHours(), now.getMinutes(), now.getSeconds());
}

function setMode(m) {
  mode = m;
  clearInterval(cdInterval); clearInterval(swInterval);
  cdInterval = null; swInterval = null; swRunning = false;
  document.getElementById('sw-btn').textContent = 'START';
  ['clock','countdown','stopwatch'].forEach(id => {
    const btn = document.getElementById('btn-' + id);
    btn.className = id === m
      ? 'px-4 py-1.5 rounded bg-orange-800 text-orange-200 text-xs font-mono tracking-wider'
      : 'px-4 py-1.5 rounded bg-gray-800 text-gray-500 text-xs font-mono tracking-wider';
    const ctrl = document.getElementById('controls-' + id);
    if (ctrl) ctrl.classList.toggle('hidden', id !== m || id === 'clock');
  });
  if (m === 'clock') {
    tickClock();
    cdInterval = setInterval(tickClock, 1000);
  } else if (m === 'countdown') {
    renderDisplay(0, parseInt(document.getElementById('cd-min').value)||0, parseInt(document.getElementById('cd-sec').value)||0);
  } else {
    renderDisplay(0,0,0);
  }
}

function cdStart() {
  clearInterval(cdInterval);
  const mins = parseInt(document.getElementById('cd-min').value)||0;
  const secs = parseInt(document.getElementById('cd-sec').value)||0;
  cdRemaining = mins * 60 + secs;
  if (cdRemaining <= 0) return;
  const tick = () => {
    if (cdRemaining <= 0) { clearInterval(cdInterval); renderDisplay(0,0,0); return; }
    cdRemaining--;
    renderDisplay(Math.floor(cdRemaining/3600), Math.floor((cdRemaining%3600)/60), cdRemaining%60);
  };
  tick();
  cdInterval = setInterval(tick, 1000);
}
function cdReset() {
  clearInterval(cdInterval);
  renderDisplay(0, parseInt(document.getElementById('cd-min').value)||0, parseInt(document.getElementById('cd-sec').value)||0);
}

function swToggle() {
  swRunning = !swRunning;
  document.getElementById('sw-btn').textContent = swRunning ? 'STOP' : 'START';
  if (swRunning) {
    let last = Date.now();
    swInterval = setInterval(() => {
      const now = Date.now();
      swMs += now - last; last = now;
      const total = Math.floor(swMs/1000);
      renderDisplay(Math.floor(total/3600), Math.floor((total%3600)/60), total%60);
    }, 100);
  } else {
    clearInterval(swInterval);
  }
}
function swReset() {
  clearInterval(swInterval); swRunning = false; swMs = 0;
  document.getElementById('sw-btn').textContent = 'START';
  renderDisplay(0,0,0);
}

setMode('clock');
</script>
</body>
</html>
